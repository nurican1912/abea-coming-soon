<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -4.5 261.5 334.5" fill="none"
     role="img" aria-label="Afet Bilinci Eğitim Araştırma Derneği logosu, animasyonlu">
  <title>Afet Bilinci EAD — logo animasyonu</title>
  <style>
    /* Merkezden yayılan dalga, ayrım hattında kalınlaşıp yukarı çubuğa dönüşüyor. */
    .dot   { transform-box: fill-box; transform-origin: center;
             animation: pop .44s cubic-bezier(.2,.9,.25,1.25) both; }
    .wave  { transform-box: fill-box; transform-origin: center;
             animation: wave 1s cubic-bezier(.4,0,.2,1) .12s both; }
    .s     { animation-fill-mode: both; }
    .thin  { animation-name: draw; animation-duration: .7s;
             animation-timing-function: cubic-bezier(.33,0,.12,1); }
    .thick { animation-name: draw; animation-duration: .76s;
             animation-timing-function: cubic-bezier(.4,0,.2,1); }
    @keyframes pop  { from { transform: scale(0) } to { transform: scale(1) } }
    @keyframes wave { from { transform: scale(1);   opacity: .55 }
                      to   { transform: scale(6.4); opacity: 0 } }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .t0 { stroke-dasharray: 146.4; stroke-dashoffset: 146.4; animation-delay: 0.22s }
    .t1 { stroke-dasharray: 199.1; stroke-dashoffset: 199.1; animation-delay: 0.30s }
    .t2 { stroke-dasharray: 252.8; stroke-dashoffset: 252.8; animation-delay: 0.38s }
    .t3 { stroke-dasharray: 306.6; stroke-dashoffset: 306.6; animation-delay: 0.46s }
    .t4 { stroke-dasharray: 360.6; stroke-dashoffset: 360.6; animation-delay: 0.54s }
    .t5 { stroke-dasharray: 414.5; stroke-dashoffset: 414.5; animation-delay: 0.62s }
    .k0 { stroke-dasharray: 210.6; stroke-dashoffset: 210.6; animation-delay: 0.76s }
    .k1 { stroke-dasharray: 239.2; stroke-dashoffset: 239.2; animation-delay: 0.84s }
    .k2 { stroke-dasharray: 266.6; stroke-dashoffset: 266.6; animation-delay: 0.92s }
    .k3 { stroke-dasharray: 293.7; stroke-dashoffset: 293.7; animation-delay: 1.00s }
    .k4 { stroke-dasharray: 320.8; stroke-dashoffset: 320.8; animation-delay: 1.08s }
    .k5 { stroke-dasharray: 347.9; stroke-dashoffset: 347.9; animation-delay: 1.16s }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 }
      .wave { opacity: 0 }
    }
  </style>
  <defs>
    <clipPath id="l"><rect x="0" y="0" width="143.7" height="332"/></clipPath>
    <clipPath id="r"><rect x="143.7" y="0" width="315" height="332"/></clipPath>
  </defs>
  <circle class="wave" cx="125" cy="197" r="19" fill="none" stroke="#28ADE5" stroke-width="3" opacity="0"/>
  <g clip-path="url(#l)" stroke="#28ADE5" stroke-width="6.0" fill="none">
    <path class="s thin t0" d="M 143.70 168.60 A 34.00 34.00 0 1 0 143.70 225.40"/>
    <path class="s thin t1" d="M 143.70 149.34 A 51.20 51.20 0 1 0 143.70 244.66"/>
    <path class="s thin t2" d="M 143.70 131.21 A 68.40 68.40 0 1 0 143.70 262.79"/>
    <path class="s thin t3" d="M 143.70 113.47 A 85.60 85.60 0 1 0 143.70 280.53"/>
    <path class="s thin t4" d="M 143.70 95.92 A 102.80 102.80 0 1 0 143.70 298.08"/>
    <path class="s thin t5" d="M 143.70 78.47 A 120.00 120.00 0 1 0 143.70 315.53"/>
  </g>
  <g clip-path="url(#r)" stroke="#28ADE5" stroke-width="13.5" fill="none">
    <path class="s thick k0" d="M 143.70 214.34 A 25.50 25.50 0 0 0 150.50 197.00 L 150.50 5.50"/>
    <path class="s thick k1" d="M 143.70 235.39 A 42.70 42.70 0 0 0 167.70 197.00 L 167.70 5.50"/>
    <path class="s thick k2" d="M 143.70 253.91 A 59.90 59.90 0 0 0 184.90 197.00 L 184.90 5.50"/>
    <path class="s thick k3" d="M 143.70 271.80 A 77.10 77.10 0 0 0 202.10 197.00 L 202.10 5.50"/>
    <path class="s thick k4" d="M 143.70 289.43 A 94.30 94.30 0 0 0 219.30 197.00 L 219.30 5.50"/>
    <path class="s thick k5" d="M 143.70 306.92 A 111.50 111.50 0 0 0 236.50 197.00 L 236.50 5.50"/>
  </g>
  <circle class="dot" cx="125" cy="197" r="19" fill="#28ADE5"/>
</svg>
